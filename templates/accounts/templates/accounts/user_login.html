{% extends "base.html" %}

{% block title %}Entrar{% endblock %}

{% block content %}
    <h1>Entrar</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
    <a href="{% url 'accounts:register' %}" class="btn btn-outline-secondary">Criar conta</a>
{% endblock %}
