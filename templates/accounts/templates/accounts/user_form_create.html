{% extends "base.html" %}

{% block title %}Criar conta{% endblock %}

{% block content %}
    <h1>Criar conta</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Cadastrar</button>
    </form>
    <a href="{% url 'accounts:login' %}" class="btn btn-outline-secondary">Já tenho conta</a>
{% endblock %}
